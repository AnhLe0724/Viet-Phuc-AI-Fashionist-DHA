# SCHEMA CHUẨN — Knowledge Base Cổ Phục Việt Nam
# File này là template cho tất cả các file trang phục

id: [unique_id]
name: [Tên trang phục]
name_en: [English name]
aliases: [Các tên gọi khác]
category: [northern | central | southern | national | court]
gender: [female | male | unisex]
historical_period: [Thời kỳ lịch sử]
origin_region: [Vùng xuất xứ]

# --- NHẬN DẠNG HÌNH ẢNH (dùng cho Vision AI) ---
# AI dùng để nhận dạng khi người dùng upload ảnh
visual_identifiers:
  silhouette: [Mô tả dáng tổng thể]
  collar: [Kiểu cổ]
  closure: [Cách cài/buộc]
  length: [Độ dài]
  layers: [Số lớp]
  distinctive_elements: [Các yếu tố nhận dạng đặc trưng]
  colors_traditional: [Màu sắc truyền thống thường gặp]
  common_patterns: [Họa tiết thường gặp]

# --- Ý NGHĨA VĂN HÓA ---
cultural_meaning:
  symbolism: [Ý nghĩa biểu tượng]
  historical_context: [Bối cảnh lịch sử]
  social_role: [Vai trò xã hội khi mặc]
  associated_values: [Các giá trị gắn liền]
  fun_facts: [Sự kiện thú vị cho Gen Z]

# --- MA TRẬN DỊP (QUAN TRỌNG NHẤT cho AI) ---
# AI dùng để quyết định trang phục nào phù hợp dịp nào
occasion_matrix:
  perfect_fit:     # Score 5/5 - Hoàn toàn phù hợp
    - [dịp_id]: [lý do ngắn gọn]
  good_fit:        # Score 4/5 - Phù hợp tốt
    - [dịp_id]: [lý do]
  acceptable:      # Score 3/5 - Chấp nhận được
    - [dịp_id]: [điều kiện cần đáp ứng]
  not_recommended: # Score 2/5 - Không khuyến khích
    - [dịp_id]: [lý do]
  avoid:           # Score 1/5 - Tránh mặc
    - [dịp_id]: [lý do]

# --- MỨC ĐỘ TRANG TRỌNG ---
# AI dùng để match với yêu cầu của người dùng
formality:
  score: [1-10]  # 1=casual, 10=ceremonial
  level: [casual | semi-formal | formal | ceremonial]
  notes: [Ghi chú điều chỉnh trang trọng]
  can_be_adjusted_by: [Các yếu tố có thể tăng/giảm trang trọng]

# --- QUY TẮC THỜI TIẾT (QUAN TRỌNG) ---
# AI dùng để lọc theo điều kiện thời tiết
weather_rules:
  hot:   # >32°C
    suitable_fabrics: []
    avoid_fabrics: []
    tips: ""
  warm:  # 25-32°C
    suitable_fabrics: []
    tips: ""
  cool:  # 18-25°C
    suitable_fabrics: []
    tips: ""
  cold:  # <18°C
    suitable_fabrics: []
    avoid_fabrics: []
    tips: ""
  rainy:
    considerations: ""
    tips: ""

# --- QUY TẮC MÀU SẮC THEO DỊP (QUAN TRỌNG) ---
# AI dùng để tránh tư vấn màu sai dịp / màu kiêng kị
color_rules:
